[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trifecta-guard"
version = "0.1.0"
description = "Prompt-injection firewall and taint gate for AI agents: Claude Code hooks and an MCP proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nina Doinjashvili" }]
keywords = ["ai-agents", "prompt-injection", "mcp", "claude-code", "llm-security", "guardrails"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Intended Audience :: Developers",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
# Local Hugging Face classifier as an extra detection layer.
ml = ["transformers>=4.40", "torch>=2.2"]
# `mcp` is used in tests to drive the proxy with the official SDK client and server.
dev = ["pytest>=7.0", "ruff>=0.9", "build>=1", "mcp>=1.0,<3"]

[project.urls]
Repository = "https://github.com/Ninadnj/trifecta-guard"
Issues = "https://github.com/Ninadnj/trifecta-guard/issues"

[project.scripts]
trifecta-guard = "trifecta_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trifecta_guard"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
